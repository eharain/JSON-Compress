name: javascript

on:
  push:
    branches: [main]
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'
  pull_request:
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'

defaults:
  run:
    working-directory: javascript

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Benchmark
        run: npm run bench

      - name: Check the package contents
        run: npm pack --dry-run
